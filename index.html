button{white-space:nowrap;text-transform:none;letter-spacing:normal}
.foot-link{transition:color 200ms ease}.foot-link:hover,.foot-link:focus-visible{color:#21386B!important;text-decoration:underline!important;text-underline-offset:4px}
@media (max-width: 1180px){.nav-links{display:none!important}}
@media (max-width: 640px){.hdr{flex-wrap:wrap!important;gap:12px 16px!important;padding:12px 20px!important}.hdr>a>span:not(:first-child){display:none!important}.hdr>div{margin-left:auto}}
@media (max-width: 860px){.hero-art{display:none!important}}
.tl-prog{will-change:transform}
@keyframes tl-grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes hero-in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes orbit-spin{to{transform:rotate(360deg)}}
.hero-copy>*{animation:hero-in .8s cubic-bezier(.2,.7,.2,1) both}
.hero-copy>*:nth-child(2){animation-delay:.08s}.hero-copy>*:nth-child(3){animation-delay:.16s}.hero-copy>*:nth-child(4){animation-delay:.24s}.hero-copy>*:nth-child(5){animation-delay:.32s}
.orbit-slow{animation:orbit-spin 140s linear infinite}
@media (max-width: 860px){.tl-grid{grid-template-columns:1fr!important;padding-top:0!important}.tl-line{display:none!important}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}

@media (max-width: 860px){.hdr-art{display:none!important}}
[role=radio],[role=radio] span,#view-apply button,button{white-space:normal;text-transform:none;letter-spacing:normal}
[role=radio] span{display:block;overflow-wrap:anywhere}



html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
a,button,summary{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
a[href],button{transition:transform 140ms cubic-bezier(0.25,0.46,0.45,0.94),background-color 200ms ease,color 200ms ease,box-shadow 200ms ease}
a[href]:active,button:active{transform:scale(0.97)}
.faq-sign{transition:transform 220ms cubic-bezier(0.22,1,0.36,1)}
details[open]>summary~*{animation:faq-in 260ms cubic-bezier(0.22,1,0.36,1)}
@keyframes faq-in{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.js .reveal{opacity:0;transform:translateY(28px);transition:opacity 700ms cubic-bezier(0.22,1,0.36,1),transform 700ms cubic-bezier(0.22,1,0.36,1)}
.js .reveal.in{opacity:1;transform:none}
.js .pop{opacity:0;transform:scale(0.6);transition:opacity 500ms cubic-bezier(0.22,1,0.36,1),transform 600ms cubic-bezier(0.34,1.56,0.64,1)}
.js .pop.in{opacity:1;transform:none}
.js .tl-prog{animation-play-state:paused}
.js .tl.in .tl-prog{animation-play-state:running}
.view{animation:view-in 320ms cubic-bezier(0.22,1,0.36,1)}
@keyframes view-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
[hidden]{display:none!important}
.field-error{border-color:#C1121F!important;box-shadow:0 0 0 3px rgba(193,18,31,0.15)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion: reduce){.js .reveal,.js .pop{opacity:1!important;transform:none!important;transition:none!important}}

<div style="flex: 1 1 320px; min-width: 0">
<h2 id="faq-title" style="margin: 0; font-family: 'Inter', sans-serif; font-size: clamp(32px, 3.2vw, 44px); line-height: 1.1; font-weight: 700; color: #21386B">Mission<br>briefing</h2>
</div>
<div style="flex: 2 1 600px; min-width: 0; display: flex; flex-direction: column; gap: 12px">

<details style="background: #FFFFFF; border: 1.5px solid #21386B; border-radius: 4px; padding: 0 26px"><summary style="display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 64px; font-weight: 700; font-size: 19px; cursor: pointer; color: #21386B">The call closes on 18 November. Why apply now?<span class="faq-sign" aria-hidden="true" style="flex: 0 0 32px; height: 32px; border-radius: 50%; border: 2px solid #C4D40C; display: flex; align-items: center; justify-content: center;  line-height: 1; color: #21386B">+</span></summary><p style="margin: 0 0 22px; color: #444444; max-width: 640px">Because selection is rolling. We review applications as they arrive and give slots to strong fits straight away. Once all eight are taken, the competition is full, even if the call is technically still open.</p></details>

<details style="background: #FFFFFF; border: 1.5px solid #21386B; border-radius: 4px; padding: 0 26px"><summary style="display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 64px; font-weight: 700; font-size: 19px; cursor: pointer; color: #21386B">When will we hear back?<span class="faq-sign" aria-hidden="true" style="flex: 0 0 32px; height: 32px; border-radius: 50%; border: 2px solid #C4D40C; display: flex; align-items: center; justify-content: center;  line-height: 1; color: #21386B">+</span></summary><p style="margin: 0 0 22px; color: #444444; max-width: 640px">Strong fits hear from us quickly, as soon as possible, so we can lock in your slot and plan the rehearsal. Everyone else hears back once the call closes.</p></details>

<details style="background: #FFFFFF; border: 1.5px solid #21386B; border-radius: 4px; padding: 0 26px"><summary style="display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 64px; font-weight: 700; font-size: 19px; cursor: pointer; color: #21386B">Does it cost anything?<span class="faq-sign" aria-hidden="true" style="flex: 0 0 32px; height: 32px; border-radius: 50%; border: 2px solid #C4D40C; display: flex; align-items: center; justify-content: center;  line-height: 1; color: #21386B">+</span></summary><p style="margin: 0 0 22px; color: #444444; max-width: 640px">No. Applying, taking part and entering the fair are all free, with unlimited passes for your team.</p></details>

<details style="background: #FFFFFF; border: 1.5px solid #21386B; border-radius: 4px; padding: 0 26px"><summary style="display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 64px; font-weight: 700; font-size: 19px; cursor: pointer; color: #21386B">Who covers travel?<span class="faq-sign" aria-hidden="true" style="flex: 0 0 32px; height: 32px; border-radius: 50%; border: 2px solid #C4D40C; display: flex; align-items: center; justify-content: center;  line-height: 1; color: #21386B">+</span></summary><p style="margin: 0 0 22px; color: #444444; max-width: 640px">Finalists receive a contribution towards their train travel. Any other travel and accommodation costs are covered by each startup.</p></details>

<details style="background: #FFFFFF; border: 1.5px solid #21386B; border-radius: 4px; padding: 0 26px"><summary style="display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 64px; font-weight: 700; font-size: 19px; cursor: pointer; color: #21386B">We’re not incorporated yet. Can we apply?<span class="faq-sign" aria-hidden="true" style="flex: 0 0 32px; height: 32px; border-radius: 50%; border: 2px solid #C4D40C; display: flex; align-items: center; justify-content: center;  line-height: 1; color: #21386B">+</span></summary><p style="margin: 0 0 22px; color: #444444; max-width: 640px">Not this time. Your company needs to be incorporated, and no more than 10 years ago.</p></details>

<details style="background: #FFFFFF; border: 1.5px solid #21386B; border-radius: 4px; padding: 0 26px"><summary style="display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 64px; font-weight: 700; font-size: 19px; cursor: pointer; color: #21386B">Do we have to pitch in English?<span class="faq-sign" aria-hidden="true" style="flex: 0 0 32px; height: 32px; border-radius: 50%; border: 2px solid #C4D40C; display: flex; align-items: center; justify-content: center;  line-height: 1; color: #21386B">+</span></summary><p style="margin: 0 0 22px; color: #444444; max-width: 640px">Yes. Both the pitch and the Q&amp;A with the jury are in English.</p></details>

<details style="background: #FFFFFF; border: 1.5px solid #21386B; border-radius: 4px; padding: 0 26px"><summary style="display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 64px; font-weight: 700; font-size: 19px; cursor: pointer; color: #21386B">How long is each pitch?<span class="faq-sign" aria-hidden="true" style="flex: 0 0 32px; height: 32px; border-radius: 50%; border: 2px solid #C4D40C; display: flex; align-items: center; justify-content: center;  line-height: 1; color: #21386B">+</span></summary><p style="margin: 0 0 22px; color: #444444; max-width: 640px">Each startup has 5 minutes to pitch and 10 minutes of Q&amp;A with the jury, Shark Tank style. The exact time slot in the afternoon will be confirmed before the stage rehearsal.</p></details>

<details style="background: #FFFFFF; border: 1.5px solid #21386B; border-radius: 4px; padding: 0 26px"><summary style="display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 64px; font-weight: 700; font-size: 19px; cursor: pointer; color: #21386B">Who’s on the jury?<span class="faq-sign" aria-hidden="true" style="flex: 0 0 32px; height: 32px; border-radius: 50%; border: 2px solid #C4D40C; display: flex; align-items: center; justify-content: center;  line-height: 1; color: #21386B">+</span></summary><p style="margin: 0 0 22px; color: #444444; max-width: 640px">Industry leaders and investors from the Space Economy, including Maria Cristina Lupi (Leonardo Space Division) and Viktor Shpakovsky (Beyond Earth Ventures). More names will appear here as soon as they’re official.</p></details>

<details style="background: #FFFFFF; border: 1.5px solid #21386B; border-radius: 4px; padding: 0 26px"><summary style="display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 64px; font-weight: 700; font-size: 19px; cursor: pointer; color: #21386B">What can we win?<span class="faq-sign" aria-hidden="true" style="flex: 0 0 32px; height: 32px; border-radius: 50%; border: 2px solid #C4D40C; display: flex; align-items: center; justify-content: center;  line-height: 1; color: #21386B">+</span></summary><p style="margin: 0 0 22px; color: #444444; max-width: 640px">A €5,000 prize offered by Fiera Roma, awarded by the technical jury at the end of the pitch competition. Further prizes in services and from investors are being confirmed.</p></details>

<details style="background: #FFFFFF; border: 1.5px solid #21386B; border-radius: 4px; padding: 0 26px"><summary style="display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 64px; font-weight: 700; font-size: 19px; cursor: pointer; color: #21386B">How are startups selected?<span class="faq-sign" aria-hidden="true" style="flex: 0 0 32px; height: 32px; border-radius: 50%; border: 2px solid #C4D40C; display: flex; align-items: center; justify-content: center;  line-height: 1; color: #21386B">+</span></summary><p style="margin: 0 0 22px; color: #444444; max-width: 640px">We look at fit with the two tracks, the strength of your product and team, and how ready you are for the stage. Full criteria are in the rules.</p></details>

</div>
</div>

<details style="background: #FFFFFF; border: 1.5px solid #21386B; border-radius: 4px; padding: 0 26px"><summary style="display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 64px; font-weight: 700; font-size: 19px; cursor: pointer; color: #21386B">La call chiude il 18 novembre. Perché candidarsi subito?<span class="faq-sign" aria-hidden="true" style="flex: 0 0 32px; height: 32px; border-radius: 50%; border: 2px solid #C4D40C; display: flex; align-items: center; justify-content: center;  line-height: 1; color: #21386B">+</span></summary><p style="margin: 0 0 22px; color: #444444; max-width: 640px">Perché la selezione è a sportello. Valutiamo le candidature appena arrivano e assegniamo subito gli slot alle startup in linea. Quando gli otto slot sono pieni, la competition è al completo, anche se la call è ancora aperta.</p></details>

<details style="background: #FFFFFF; border: 1.5px solid #21386B; border-radius: 4px; padding: 0 26px"><summary style="display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 64px; font-weight: 700; font-size: 19px; cursor: pointer; color: #21386B">Quando riceveremo una risposta?<span class="faq-sign" aria-hidden="true" style="flex: 0 0 32px; height: 32px; border-radius: 50%; border: 2px solid #C4D40C; display: flex; align-items: center; justify-content: center;  line-height: 1; color: #21386B">+</span></summary><p style="margin: 0 0 22px; color: #444444; max-width: 640px">Se siete in linea vi contattiamo in fretta, il prima possibile, per bloccare lo slot e organizzare la prova. Tutti gli altri ricevono una risposta alla chiusura della call.</p></details>

<details style="background: #FFFFFF; border: 1.5px solid #21386B; border-radius: 4px; padding: 0 26px"><summary style="display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 64px; font-weight: 700; font-size: 19px; cursor: pointer; color: #21386B">Partecipare costa qualcosa?<span class="faq-sign" aria-hidden="true" style="flex: 0 0 32px; height: 32px; border-radius: 50%; border: 2px solid #C4D40C; display: flex; align-items: center; justify-content: center;  line-height: 1; color: #21386B">+</span></summary><p style="margin: 0 0 22px; color: #444444; max-width: 640px">No. Candidatura, partecipazione e ingresso in fiera sono gratuiti, con pass illimitati per il team.</p></details>

<details style="background: #FFFFFF; border: 1.5px solid #21386B; border-radius: 4px; padding: 0 26px"><summary style="display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 64px; font-weight: 700; font-size: 19px; cursor: pointer; color: #21386B">Chi copre le spese di viaggio?<span class="faq-sign" aria-hidden="true" style="flex: 0 0 32px; height: 32px; border-radius: 50%; border: 2px solid #C4D40C; display: flex; align-items: center; justify-content: center;  line-height: 1; color: #21386B">+</span></summary><p style="margin: 0 0 22px; color: #444444; max-width: 640px">I finalisti ricevono un contributo per il viaggio in treno. Le altre spese di trasferta e alloggio sono a carico di ciascuna startup.</p></details>

<details style="background: #FFFFFF; border: 1.5px solid #21386B; border-radius: 4px; padding: 0 26px"><summary style="display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 64px; font-weight: 700; font-size: 19px; cursor: pointer; color: #21386B">Non siamo ancora costituiti. Possiamo candidarci?<span class="faq-sign" aria-hidden="true" style="flex: 0 0 32px; height: 32px; border-radius: 50%; border: 2px solid #C4D40C; display: flex; align-items: center; justify-content: center;  line-height: 1; color: #21386B">+</span></summary><p style="margin: 0 0 22px; color: #444444; max-width: 640px">Non questa volta. La società deve essere già costituita, da non più di 10 anni.</p></details>

<details style="background: #FFFFFF; border: 1.5px solid #21386B; border-radius: 4px; padding: 0 26px"><summary style="display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 64px; font-weight: 700; font-size: 19px; cursor: pointer; color: #21386B">Il pitch va fatto in inglese?<span class="faq-sign" aria-hidden="true" style="flex: 0 0 32px; height: 32px; border-radius: 50%; border: 2px solid #C4D40C; display: flex; align-items: center; justify-content: center;  line-height: 1; color: #21386B">+</span></summary><p style="margin: 0 0 22px; color: #444444; max-width: 640px">Sì. Sia il pitch sia le domande della giuria sono in inglese.</p></details>

<details style="background: #FFFFFF; border: 1.5px solid #21386B; border-radius: 4px; padding: 0 26px"><summary style="display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 64px; font-weight: 700; font-size: 19px; cursor: pointer; color: #21386B">Quanto dura ogni pitch?<span class="faq-sign" aria-hidden="true" style="flex: 0 0 32px; height: 32px; border-radius: 50%; border: 2px solid #C4D40C; display: flex; align-items: center; justify-content: center;  line-height: 1; color: #21386B">+</span></summary><p style="margin: 0 0 22px; color: #444444; max-width: 640px">Ogni startup ha 5 minuti di pitch e 10 minuti di domande della giuria, in stile Shark Tank. L’orario esatto nel pomeriggio sarà confermato prima della prova sul palco.</p></details>

<details style="background: #FFFFFF; border: 1.5px solid #21386B; border-radius: 4px; padding: 0 26px"><summary style="display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 64px; font-weight: 700; font-size: 19px; cursor: pointer; color: #21386B">Chi c’è in giuria?<span class="faq-sign" aria-hidden="true" style="flex: 0 0 32px; height: 32px; border-radius: 50%; border: 2px solid #C4D40C; display: flex; align-items: center; justify-content: center;  line-height: 1; color: #21386B">+</span></summary><p style="margin: 0 0 22px; color: #444444; max-width: 640px">Industry leader e investitori della Space Economy, tra cui Maria Cristina Lupi (Leonardo Space Division) e Viktor Shpakovsky (Beyond Earth Ventures). Gli altri nomi compariranno qui appena saranno ufficiali.</p></details>

<details style="background: #FFFFFF; border: 1.5px solid #21386B; border-radius: 4px; padding: 0 26px"><summary style="display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 64px; font-weight: 700; font-size: 19px; cursor: pointer; color: #21386B">Cosa si vince?<span class="faq-sign" aria-hidden="true" style="flex: 0 0 32px; height: 32px; border-radius: 50%; border: 2px solid #C4D40C; display: flex; align-items: center; justify-content: center;  line-height: 1; color: #21386B">+</span></summary><p style="margin: 0 0 22px; color: #444444; max-width: 640px">Un premio da 5.000 € offerto da Fiera Roma, assegnato dalla giuria tecnica al termine della pitch competition. Sono in via di conferma altri premi in servizi e dagli investitori.</p></details>

<details style="background: #FFFFFF; border: 1.5px solid #21386B; border-radius: 4px; padding: 0 26px"><summary style="display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 64px; font-weight: 700; font-size: 19px; cursor: pointer; color: #21386B">Come vengono selezionate le startup?<span class="faq-sign" aria-hidden="true" style="flex: 0 0 32px; height: 32px; border-radius: 50%; border: 2px solid #C4D40C; display: flex; align-items: center; justify-content: center;  line-height: 1; color: #21386B">+</span></summary><p style="margin: 0 0 22px; color: #444444; max-width: 640px">Guardiamo la coerenza con le due track, la solidità di prodotto e team e quanto siete pronti per il palco. I criteri completi sono nel regolamento.</p></details>

<script>(function(){
  var KEY='nseSpaceTankLang';
  var q=new URLSearchParams(location.search).get('lang');
  var saved=null; try{saved=localStorage.getItem(KEY);}catch(e){}
  var lang=(q==='it'||q==='en')?q:((saved==='it'||saved==='en')?saved:'en');
  try{localStorage.setItem(KEY,lang);}catch(e){}
  window.TITLES = lang==='it'
    ? {home:'The Startup Space Tank \u2014 La pitch competition di NSE 2026', apply:'Candidati \u2014 The Startup Space Tank'}
    : {home:'The Startup Space Tank \u2014 Pitch competition at NSE 2026', apply:'Apply \u2014 The Startup Space Tank'};
  var tpl=document.getElementById('tpl-'+lang), app=document.getElementById('app');
  app.appendChild(document.importNode(tpl.content,true));
  document.documentElement.setAttribute('lang',lang);
  var sw=app.querySelectorAll('a[hreflang]');
  for(var i=0;i<sw.length;i++){(function(a){
    var to=a.getAttribute('hreflang');
    var u=new URL(location.href); u.searchParams.set('lang',to); a.setAttribute('href', u.pathname+u.search+u.hash);
    a.addEventListener('click',function(){try{localStorage.setItem(KEY,to);}catch(e){} var v=new URL(location.href); v.searchParams.set('lang',to); a.setAttribute('href', v.pathname+v.search+v.hash);});
  })(sw[i]);}
})();
</script>
<script>

(function(){
  var LANG = document.documentElement.lang === 'it' ? 'it' : 'en';
  var EMBED = document.documentElement.classList.contains('embed');
  var PARENT_ORIGIN = '*'; // in produzione: 'https://www.nseexpoforum.com'
  var ENDPOINT = ''; // URL /exec dell'Apps Script (Google Sheet). Vuoto = demo.
  document.documentElement.classList.add('js');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- views (landing / form) ---------- */
  var home = document.getElementById('view-home'), apply = document.getElementById('view-apply');
  function route(){
    var isApply = location.hash === '#apply';
    home.hidden = isApply; apply.hidden = !isApply;
    var v = isApply ? apply : home;
    v.classList.remove('view'); void v.offsetWidth; v.classList.add('view');
    if (isApply) { if (!EMBED) window.scrollTo(0, 0); var h = apply.querySelector('h1'); if (h) { h.setAttribute('tabindex','-1'); h.focus({preventScroll:true}); } }
    else if (location.hash && location.hash.length > 1) { var t = document.getElementById(location.hash.slice(1)); if (t) t.scrollIntoView(); else window.scrollTo(0, 0); }
    else window.scrollTo(0, 0);
    document.title = isApply ? TITLES.apply : TITLES.home;
    observe();
  }
  window.addEventListener('hashchange', route);

  /* ---------- reveal on scroll ---------- */
  var groups = [
    ['#view-home section h2, #view-home section > div > p, #view-home article, #view-home dl, #view-home .tl', 'reveal', 0],
    ['#view-home #why li', 'reveal', 70], ['#view-home #who li', 'reveal', 50], ['#view-home #how > div > ul > li', 'reveal', 80],
    ['#view-home #prize li', 'reveal', 80], ['#view-home ol:not(.tl-grid) > li', 'reveal', 90],
    ['#view-home ul[aria-label] > li', 'pop', 60], ['#view-home #faq details', 'reveal', 40],
    ['#view-apply fieldset, #view-apply aside > section', 'reveal', 60]
  ];
  var io = ('IntersectionObserver' in window) ? new IntersectionObserver(function(es){ es.forEach(function(e){ if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }); }, {threshold: 0.12, rootMargin: '0px 0px -40px 0px'}) : null;
  groups.forEach(function(g){
    var els = document.querySelectorAll(g[0]);
    Array.prototype.forEach.call(els, function(el, i){
      if (el.closest('[id="top"]') && !el.classList.contains('tl')) return; // hero keeps its own entrance
      if (el.classList.contains('reveal') || el.classList.contains('pop')) return;
      el.classList.add(g[1]);
      if (g[2]) el.style.transitionDelay = ((i % 8) * g[2]) + 'ms';
    });
  });
  function observe(){
    var els = document.querySelectorAll('.reveal:not(.in), .pop:not(.in)');
    Array.prototype.forEach.call(els, function(el){ if (!io || reduce || EMBED) el.classList.add('in'); else io.observe(el); });
  }

  /* ---------- live timeline ---------- */
  (function(){
    var ISO = ['2026-10-26','2026-10-27','2026-11-18','2026-11-23','2026-11-26','2026-11-27'];
    var day = 86400000, ds = ISO.map(function(d){ return new Date(d + 'T00:00:00').getTime(); });
    var n = new Date(), today = new Date(n.getFullYear(), n.getMonth(), n.getDate()).getTime();
    var p = 0, label = '', show = true;
    if (today < ds[0]) { var k = Math.round((ds[0] - today) / day); label = LANG === 'it' ? (k === 1 ? 'La call apre domani' : 'La call apre tra ' + k + ' giorni') : (k === 1 ? 'Call opens tomorrow' : 'Call opens in ' + k + ' days'); }
    else if (today >= ds[ds.length - 1]) { p = 1; show = false; }
    else { var i = 0; while (today >= ds[i + 1]) i++; p = (i + (today - ds[i]) / (ds[i + 1] - ds[i])) / (ds.length - 1); label = LANG === 'it' ? 'Oggi' : 'Today'; }
    var prog = document.querySelector('.tl-prog');
    if (prog) prog.style.width = 'calc((100% + 24px) * 5 / 6 * ' + p.toFixed(4) + ')';
    var marker = document.querySelector('.tl > .tl-line:not(.tl-prog)[style*="translateX"]');
    if (marker) { marker.hidden = !show; marker.style.left = 'calc(24px + (100% + 24px) * 5 / 6 * ' + p.toFixed(4) + ')'; marker.firstElementChild.textContent = label; }
    var SR = LANG === 'it' ? ['completato','in corso','in arrivo'] : ['done','in progress','upcoming'];
    var cur = today < ds[0] ? -1 : ds.reduce(function(a, d, i){ return today >= d ? i : a; }, -1);
    var dDone = 'width: 48px; height: 48px; border-radius: 50%; background: #C4D40C; box-sizing: border-box;';
    var dNext = 'width: 48px; height: 48px; border-radius: 50%; background: #21386B; border: 2px solid #C4D40C; box-sizing: border-box;';
    var dGoal = 'width: 48px; height: 48px; border-radius: 50%; background: #21386B; border: 6px solid #C4D40C; box-sizing: border-box; box-shadow: 0 0 0 10px rgba(196,212,12,0.16);';
    var lis = document.querySelectorAll('.tl-grid > li');
    Array.prototype.forEach.call(lis, function(li, i){
      var done = today >= ds[i];
      li.firstElementChild.setAttribute('style', done ? dDone : (i === ds.length - 1 ? dGoal : dNext));
      li.setAttribute('aria-current', i === cur ? 'step' : 'false');
      li.lastElementChild.textContent = '(' + (done ? (i === cur && i < ds.length - 1 ? SR[1] : SR[0]) : SR[2]) + ')';
    });
  })();

  /* ---------- form ---------- */
  var form = apply.querySelector('form'), ok = document.getElementById('apply-ok');
  if (form) {
    form.setAttribute('novalidate', '');
    var NAMES = ['startup_name','website','founded_year','space_application','one_liner','stage','pitch_deck_url','contact_first','contact_last','contact_role','contact_email','contact_phone','ok_attendance','ok_rehearsal','ok_privacy_rules','ok_share','ok_marketing'];
    var fields = form.querySelectorAll('input:not([type=hidden]):not([name=company_website]), select, textarea');
    Array.prototype.forEach.call(fields, function(f, i){ if (NAMES[i]) { f.name = NAMES[i]; f.id = 'f-' + NAMES[i]; } });
    var space = document.getElementById('space-field'), spaceInput = space && space.querySelector('input');
    var tracks = form.querySelectorAll('[role=radio]'), TRACK_IDS = ['A-up','A-down','B'], track = null;
    var base = 'flex: 1 1 200px; min-width: 0; min-height: 112px; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; text-align: left; padding: 16px 18px; border-radius: 16px; font: inherit; cursor: pointer; ';
    var on = 'background: #21386B; color: #FFFFFF; border: 2px solid #C4D40C;', off = 'background: #FFFFFF; color: #21386B; border: 1.5px solid #8A93AE;';
    var trackErr = document.createElement('p'); trackErr.setAttribute('role','alert'); trackErr.hidden = true;
    trackErr.style.cssText = 'margin: 0; font-size: 15px; font-weight: 600; color: #C1121F';
    trackErr.textContent = LANG === 'it' ? 'Scegli una track per continuare.' : 'Choose a track to continue.';
    if (tracks.length) tracks[0].parentNode.parentNode.appendChild(trackErr);
    function setTrack(id){
      track = id;
      Array.prototype.forEach.call(tracks, function(b, i){ var s = TRACK_IDS[i] === id; b.setAttribute('aria-checked', s ? 'true' : 'false'); b.tabIndex = (s || (!id && i === 0)) ? 0 : -1; b.setAttribute('style', base + (s ? on : off)); });
      if (space) { space.hidden = id !== 'B'; if (spaceInput) spaceInput.required = id === 'B'; }
      if (id) trackErr.hidden = true;
    }
    Array.prototype.forEach.call(tracks, function(b, i){
      b.removeAttribute('onclick');
      b.addEventListener('click', function(){ setTrack(TRACK_IDS[i]); });
      b.addEventListener('keydown', function(e){
        var d = (e.key === 'ArrowRight' || e.key === 'ArrowDown') ? 1 : (e.key === 'ArrowLeft' || e.key === 'ArrowUp') ? -1 : 0;
        if (!d) return; e.preventDefault(); var j = (i + d + tracks.length) % tracks.length; setTrack(TRACK_IDS[j]); tracks[j].focus();
      });
    });
    setTrack(null);
    var desc = form.querySelector('textarea'), counter = desc && desc.parentNode.querySelector('[aria-live]');
    if (desc && counter) desc.addEventListener('input', function(){ counter.textContent = desc.value.length + ' / 200'; });
    var hp = document.createElement('div'); hp.setAttribute('aria-hidden','true'); hp.style.cssText = 'position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden';
    hp.innerHTML = '<label>Company website<input type="text" name="company_website" tabindex="-1" autocomplete="off"></label>'; form.appendChild(hp);
    var summary = document.createElement('div'); summary.setAttribute('role','alert'); summary.hidden = true; summary.tabIndex = -1;
    summary.style.cssText = 'padding: 16px 20px; border-radius: 16px; background: #FDECEC; color: #7A0E15; font-weight: 600; border: 1.5px solid #C1121F';
    form.insertBefore(summary, form.firstChild.nextSibling);
    function clearErr(e){ e.target.classList.remove('field-error'); e.target.removeAttribute('aria-invalid'); }
    form.addEventListener('input', clearErr); form.addEventListener('change', clearErr);
    var submit = form.querySelector('fieldset:last-of-type button');
    var submitLabel = submit ? submit.textContent : '';
    function validate(){
      var bad = [];
      Array.prototype.forEach.call(form.querySelectorAll('input, select, textarea'), function(f){
        if (f.name === 'company_website' || f.closest('[hidden]')) return;
        if (!f.checkValidity()) { bad.push(f); f.classList.add('field-error'); f.setAttribute('aria-invalid','true'); }
      });
      if (!track) { trackErr.hidden = false; bad.unshift(tracks[0]); }
      return bad;
    }
    if (submit) submit.addEventListener('click', function(){
      var bad = validate();
      if (bad.length) {
        summary.textContent = LANG === 'it' ? ('Controlla ' + bad.length + (bad.length === 1 ? ' campo' : ' campi') + ' evidenziati prima di inviare.') : ('Please check ' + bad.length + (bad.length === 1 ? ' highlighted field' : ' highlighted fields') + ' before sending.');
        summary.hidden = false; bad[0].focus(); bad[0].scrollIntoView({block: 'center', behavior: reduce ? 'auto' : 'smooth'}); return;
      }
      summary.hidden = true;
      if (form.querySelector('[name=company_website]').value) return; // bot
      var data = { submitted_at: new Date().toISOString(), lang: LANG, track: track };
      Array.prototype.forEach.call(form.querySelectorAll('[name]'), function(f){ if (f.name === 'company_website') return; data[f.name] = f.type === 'checkbox' ? f.checked : f.value.trim(); });
      var q = new URLSearchParams(location.search); ['utm_source','utm_medium','utm_campaign'].forEach(function(k){ data[k] = q.get(k) || ''; });
      submit.disabled = true; submit.textContent = LANG === 'it' ? 'Invio in corso…' : 'Sending…';
      var done = function(){ form.hidden = true; ok.hidden = false; ok.classList.add('view'); ok.setAttribute('tabindex','-1'); ok.focus(); window.scrollTo({top: 0, behavior: reduce ? 'auto' : 'smooth'}); };
      var fail = function(){ submit.disabled = false; submit.textContent = submitLabel; summary.textContent = LANG === 'it' ? 'Invio non riuscito. Riprova tra qualche istante.' : 'We couldn’t send your application. Please try again in a moment.'; summary.hidden = false; summary.focus(); };
      if (!ENDPOINT) { setTimeout(done, 600); return; }
      fetch(ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(data) }).then(function(r){ if (!r.ok) throw 0; return r.json(); }).then(function(j){ if (!j || !j.ok) throw 0; done(); }).catch(fail);
    });
  }

  /* ---------- embed (iframe) mode ---------- */
  if (EMBED) {
    var lastH = 0;
    var sendH = function(){ var h = Math.ceil(document.documentElement.getBoundingClientRect().height); if (h !== lastH) { lastH = h; parent.postMessage({ type: 'nse-arena-height', height: h }, PARENT_ORIGIN); } };
    if ('ResizeObserver' in window) new ResizeObserver(sendH).observe(document.body);
    window.addEventListener('load', sendH); window.addEventListener('resize', sendH);
    document.addEventListener('toggle', sendH, true);
    window.addEventListener('hashchange', function(){ setTimeout(function(){ sendH(); parent.postMessage({ type: 'nse-arena-top' }, PARENT_ORIGIN); }, 50); });
    setInterval(sendH, 1000);
  }
  route();
})();

</script>
